name: Cap nhat bien VPA

# Tự chạy khi có file Excel mới trong thư mục vpa/ (hoặc bấm Run workflow thủ công)
on:
  push:
    paths:
      - "vpa/**"
      - "tools/build_vpa.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: vpa-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: pip install openpyxl==3.1.5

      - name: Doc file Excel VPA
        run: python tools/build_vpa.py vpa vpa-data

      - name: Luu du lieu
        run: |
          git config user.name "vpa-bot"
          git config user.email "vpa-bot@users.noreply.github.com"
          git add -A vpa-data
          if git diff --cached --quiet; then echo "Khong co thay doi"; exit 0; fi
          git commit -m "Cap nhat du lieu bien VPA"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done

      - name: Cap nhat trang web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
