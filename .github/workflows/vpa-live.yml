# Lấy biển VPA hằng ngày giống khobienphongthuy.vn: chép file vpa-data/live.json từ khobienphongthuy.vn
# (file này do máy tính của chủ web cập nhật từ VPA mỗi ngày). Chạy mỗi giờ từ 07:25 đến 22:25 giờ VN.
name: Cap nhat bien VPA (live.json)

on:
  schedule:
    - cron: "25 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: vpa-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tải live.json từ khobienphongthuy.vn
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsSL --max-time 300 "https://khobienphongthuy.vn/vpa-data/live.json?t=$(date +%s)" -o /tmp/live.json; then break; fi
            echo "Lần $i lỗi, thử lại sau 30s"; sleep 30
          done
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/live.json", encoding="utf-8"))
          rows = d.get("rows") or []
          if not d.get("ok", True) or len(rows) < 1000:
              sys.exit(f"Dữ liệu bất thường: ok={d.get('ok')} rows={len(rows)} — giữ nguyên file cũ")
          try:
              old = json.load(open("vpa-data/live.json", encoding="utf-8"))
              if old.get("updated") == d.get("updated") and len(old.get("rows") or []) == len(rows):
                  print("Không có gì mới:", d.get("updated")); sys.exit(0)
          except Exception:
              pass
          json.dump(d, open("vpa-data/live.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("OK", len(rows), "biển, cập nhật", d.get("updated"))
          PY

      - name: Commit nếu có thay đổi
        id: commit
        run: |
          git config user.name "vpa-bot"
          git config user.email "vpa-bot@users.noreply.github.com"
          git add vpa-data/live.json
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "Cap nhat bien VPA hang ngay (theo khobienphongthuy.vn)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Cap nhat trang web
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
